apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: ghcr.io/ljs3536/mes-ai-backend
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: mes-data, key: database-url } }
            - { name: CORS_ORIGINS, value: "[\"https://localhost:13000\",\"https://localhost:8443\"]" }
            - { name: SEED_DEMO, value: "true" }
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: backend }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: backend-password } }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: ghcr.io/ljs3536/mes-ai-frontend
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_URL, value: "http://backend:8000" }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emulator-a
spec:
  replicas: 1
  selector:
    matchLabels: { app: emulator-a }
  template:
    metadata:
      labels: { app: emulator-a }
    spec:
      enableServiceLinks: false
      containers:
        - name: emulator
          image: ghcr.io/ljs3536/mes-ai-machine-emulator
          imagePullPolicy: IfNotPresent
          env:
            - { name: MACHINE_CODE, value: MACHINE_A }
            - { name: MODBUS_PORT, value: "5020" }
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: machine }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: machine-password } }
            - { name: CYCLE_SECONDS, value: "0.6" }
            - { name: RATED_RPM, value: "3000" }
            - { name: FAULT_MODE, value: none }
          ports:
            - containerPort: 5020
---
apiVersion: v1
kind: Service
metadata:
  name: emulator-a
spec:
  selector: { app: emulator-a }
  ports:
    - port: 5020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emulator-b
spec:
  replicas: 1
  selector:
    matchLabels: { app: emulator-b }
  template:
    metadata:
      labels: { app: emulator-b }
    spec:
      enableServiceLinks: false
      containers:
        - name: emulator
          image: ghcr.io/ljs3536/mes-ai-machine-emulator
          imagePullPolicy: IfNotPresent
          env:
            - { name: MACHINE_CODE, value: MACHINE_B }
            - { name: MODBUS_PORT, value: "5020" }
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: machine }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: machine-password } }
            - { name: CYCLE_SECONDS, value: "0.9" }
            - { name: RATED_RPM, value: "2400" }
            - { name: FAULT_MODE, value: bearing_overheat }
            - { name: FAULT_AFTER_SECONDS, value: "20" }
          ports:
            - containerPort: 5020
---
apiVersion: v1
kind: Service
metadata:
  name: emulator-b
spec:
  selector: { app: emulator-b }
  ports:
    - { port: 5021, targetPort: 5020 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: edge-gateway }
  template:
    metadata:
      labels: { app: edge-gateway }
    spec:
      enableServiceLinks: false
      containers:
        - name: edge-gateway
          image: ghcr.io/ljs3536/mes-ai-edge-gateway
          imagePullPolicy: IfNotPresent
          env:
            - { name: GATEWAY_ID, value: edge-gw-01 }
            - { name: MACHINES, value: "MACHINE_A=emulator-a:5020,MACHINE_B=emulator-b:5020" }
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: gateway }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: gateway-password } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app: sensor-collector }
  template:
    metadata:
      labels: { app: sensor-collector }
    spec:
      enableServiceLinks: false
      containers:
        - name: sensor-collector
          image: ghcr.io/ljs3536/mes-ai-sensor-collector
          imagePullPolicy: IfNotPresent
          env:
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: collector }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: collector-password } }
            - { name: INFLUX_URL, value: "http://influxdb:8086" }
            - name: INFLUX_TOKEN
              valueFrom: { secretKeyRef: { name: mes-data, key: influx-token } }
            - { name: INFLUX_ORG, value: mes }
            - { name: INFLUX_BUCKET, value: sensors }
            - { name: CORS_ORIGINS, value: "[\"https://localhost:13001\"]" }
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-collector
spec:
  selector: { app: sensor-collector }
  ports:
    - port: 8001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sensor-emulator-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-emulator
spec:
  replicas: 1
  selector:
    matchLabels: { app: sensor-emulator }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: sensor-emulator }
    spec:
      enableServiceLinks: false
      containers:
        - name: sensor-emulator
          image: ghcr.io/ljs3536/mes-ai-sensor-emulator
          imagePullPolicy: IfNotPresent
          env:
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: waveform }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: waveform-password } }
            - { name: MES_URL, value: "http://backend:8000" }
            - { name: DATABASE_PATH, value: /data/emulator.db }
            - { name: CORS_ORIGINS, value: "[\"https://localhost:13001\"]" }
          ports:
            - containerPort: 8002
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sensor-emulator-data }
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-emulator
spec:
  selector: { app: sensor-emulator }
  ports:
    - port: 8002
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics-backend }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: analytics-backend }
    spec:
      enableServiceLinks: false
      containers:
        - name: analytics-backend
          image: ghcr.io/ljs3536/mes-ai-analytics-backend
          imagePullPolicy: IfNotPresent
          env:
            - { name: MQTT_HOST, value: mqtt }
            - { name: MQTT_USERNAME, value: analytics }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: mes-mqtt, key: analytics-password } }
            - { name: COLLECTOR_URL, value: "http://sensor-collector:8001" }
            - { name: MES_URL, value: "http://backend:8000" }
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
            - { name: MODEL_DIR, value: /data }
            - { name: CORS_ORIGINS, value: "[\"https://localhost:13001\"]" }
          ports:
            - containerPort: 8003
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: analytics-models }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-backend
spec:
  selector: { app: analytics-backend }
  ports:
    - port: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics-frontend }
  template:
    metadata:
      labels: { app: analytics-frontend }
    spec:
      enableServiceLinks: false
      containers:
        - name: analytics-frontend
          image: ghcr.io/ljs3536/mes-ai-analytics-frontend
          imagePullPolicy: IfNotPresent
          env:
            - { name: COLLECTOR_URL, value: "http://sensor-collector:8001" }
            - { name: EMULATOR_URL, value: "http://sensor-emulator:8002" }
            - { name: ANALYTICS_URL, value: "http://analytics-backend:8003" }
            - { name: MES_URL, value: "http://backend:8000" }
            - { name: MES_PUBLIC_URL, value: "https://localhost:13000" }
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-frontend
spec:
  selector: { app: analytics-frontend }
  ports:
    - port: 3001
