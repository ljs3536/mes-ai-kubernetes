# 공장 MES를 k3d와 이후 서버 클러스터에 올리는 매니페스트.
# base는 GHCR 이미지. overlays/k3d는 이 PC의 factory-mes/*:local 이미지를 쓴다.
# Nginx가 화면만 HTTPS로 연다. DB, Influx, MQTT 비밀번호와 로그인 서명, 내부 호출 토큰은 git 밖의 Secret이다.
# Argo CD Application은 argocd/application.yaml 이고, 이 kustomization에는 넣지 않는다.
# 입고부터 출하, 진동 판정, 아직 없는 다음은 process-and-roadmap.md 에 있다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory-mes
resources:
  - namespace.yaml
  - data.yaml
  - apps.yaml
  - nginx.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mariadb-init
    files:
      - 01-schema.sql=files/init.sql
  - name: mosquitto-config
    files:
      - mosquitto.conf=files/mosquitto.conf
      - acl=files/mosquitto.acl
  - name: nginx-config
    files:
      - nginx.conf=files/nginx.conf
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/ljs3536/mes-ai-backend
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-frontend
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-machine-emulator
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-edge-gateway
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-sensor-collector
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-sensor-emulator
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-analytics-backend
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-analytics-frontend
    newTag: latest
  - name: ghcr.io/ljs3536/mes-ai-infra/mlflow
    newTag: latest
